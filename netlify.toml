# Static site — no build step.
# Netlify Forms stores submissions ("private-inquiry"; legacy "inquiry").
# The inquiry function validates, scores and forwards each submission.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Keep function source and site config out of public reach.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
