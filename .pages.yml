# Website dashboard configuration (Pages CMS — https://pagescms.org)
media:
  input: img/uploads
  output: img/uploads
  extensions: [jpg, jpeg, png, webp]
content:
  - name: settings
    label: "Contact details · بيانات التواصل"
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: whatsapp, label: "WhatsApp number (digits only, with country code)", type: string }
      - { name: whatsappDisplay, label: "WhatsApp number as displayed", type: string }
      - { name: email, label: "Email", type: string }
      - { name: linkedin, label: "LinkedIn URL (leave empty to hide)", type: string }
  - name: images
    label: "Images · الصور"
    type: file
    path: content/images.json
    format: json
    fields:
      - { name: hero, label: "Homepage hero image", type: image }
      - { name: portrait, label: "About — portrait photo", type: image }
      - { name: pillar1, label: "Advisory image", type: image }
      - { name: pillar2, label: "Investment image", type: image }
      - { name: pillar3, label: "Concierge image", type: image }
      - { name: banner_left, label: "Banner — left image", type: image }
      - { name: banner_right, label: "Banner — right image", type: image }
  - name: insights
    label: "Insights articles · المقالات"
    type: file
    path: content/insights.json
    format: json
    fields:
      - name: articles
        label: Articles
        type: object
        list: true
        fields:
          - { name: slug, label: "Link name (English letters and dashes, unique)", type: string, required: true }
          - name: category
            label: Category
            type: select
            options: { values: [tax, strategy, gov, dubai, re, trends] }
          - { name: minutes, label: "Reading time (minutes)", type: number }
          - { name: published, label: "Published (off = shows as Coming soon)", type: boolean }
          - { name: title_en, label: "Title (English)", type: string }
          - { name: title_ar, label: "العنوان (عربي)", type: string }
          - { name: title_sv, label: "Titel (svenska)", type: string }
          - { name: title_fr, label: "Titre (français)", type: string }
          - { name: title_nl, label: "Titel (Nederlands)", type: string }
          - { name: excerpt_en, label: "Summary (English)", type: text }
          - { name: excerpt_ar, label: "الملخص (عربي)", type: text }
          - { name: excerpt_sv, label: "Sammanfattning (svenska)", type: text }
          - { name: excerpt_fr, label: "Résumé (français)", type: text }
          - { name: excerpt_nl, label: "Samenvatting (Nederlands)", type: text }
          - { name: body_en, label: "Article (English)", type: rich-text }
          - { name: body_ar, label: "المقال (عربي)", type: rich-text }
          - { name: body_sv, label: "Artikel (svenska)", type: rich-text }
          - { name: body_fr, label: "Article (français)", type: rich-text }
          - { name: body_nl, label: "Artikel (Nederlands)", type: rich-text }
  - name: services
    label: "Services lists · قوائم الخدمات"
    type: file
    path: content/services.json
    format: json
    fields:
      - name: advisory
        label: "Business & Financial Advisory services"
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options: { values: [chart, tax, shield, doc, cycle, building, compass, gear, tower, key, search, users, briefcase, globe, link, med, plane, bed, car, home, star, hand] }
          - { name: title_en, label: "Title (English)", type: string }
          - { name: title_ar, label: "العنوان (عربي)", type: string }
          - { name: title_sv, label: "Titel (svenska)", type: string }
          - { name: title_fr, label: "Titre (français)", type: string }
